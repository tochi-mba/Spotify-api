name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
jobs:
  service:
    uses: tochi-mba/LUCY-assistant/.github/workflows/service.yml@v1
    with:
      # The image refuses to boot without keyring settings; these are not credentials.
      docker-env: |
        SPOTIFY_API_KEYRING_BASE_URL=http://127.0.0.1:8001
        SPOTIFY_API_KEYRING_SERVICE_TOKEN=ci-dummy-service-token-0123456789abcdef
