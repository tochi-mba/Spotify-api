name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite is hermetic -- Spotify is faked at the transport -- but settings
  # still parse at import, and credentials are required by design.
  KEYRING_BASE_URL: http://keyring.invalid
  KEYRING_SERVICE_TOKEN: ci-dummy-service-token
  ENVIRONMENT: test

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - name: pytest with a 100% coverage gate
        run: uv run pytest
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t spotify-api:ci .
      - name: Boot it and check /healthy
        run: |
          docker run -d --name probe -p 8000:8000 \
            -e KEYRING_BASE_URL=http://keyring.invalid \
            -e KEYRING_SERVICE_TOKEN=ci-dummy \
            spotify-api:ci
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/healthy && break
            sleep 1
          done
          curl -sf localhost:8000/healthy | grep -q '"status":"ok"'
          docker rm -f probe
